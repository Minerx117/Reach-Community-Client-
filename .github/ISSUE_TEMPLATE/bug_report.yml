name: Bug report
description: Report a reproducible problem with Reach Community Client.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before opening a new report. Do not attach game files, copyrighted assets, or personal data.
  - type: input
    id: version
    attributes:
      label: Client version
      placeholder: 0.01.03
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - Steam Deck / SteamOS
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include clear steps and any relevant logs. Remove usernames or other personal details.
    validations:
      required: true
